<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Swiper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Image Swiper</h1>
            <div class="stats">
                <span class="stat">Saved: <strong id="savedCount">0</strong></span>
                <span class="stat">Discarded: <strong id="discardedCount">0</strong></span>
                <span class="stat">Remaining: <strong id="remainingCount">0</strong></span>
            </div>
        </header>

        <div class="swipe-container">
            <div id="swipeHint" class="swipe-hint">
                <div class="hint-left">← Swipe left to discard</div>
                <div class="hint-right">Swipe right to save →</div>
            </div>

            <div id="cardStack" class="card-stack">
                <!-- Cards will be loaded here -->
            </div>

            <div class="no-images" id="noImages" style="display: none;">
                <p>No more images to swipe!</p>
                <button onclick="location.reload()">Refresh</button>
            </div>

            <div class="loading" id="loading">
                <p>Loading images...</p>
            </div>
        </div>

        <div class="controls">
            <button id="discardBtn" class="control-btn discard-btn" title="Discard (or press ←)">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <line x1="10" y1="10" x2="30" y2="30" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <line x1="30" y1="10" x2="10" y2="30" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </button>
            <button id="undoBtn" class="control-btn undo-btn" title="Undo last action">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <path d="M 20 10 A 10 10 0 1 0 20 30 L 25 25" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </button>
            <button id="saveBtn" class="control-btn save-btn" title="Save (or press →)">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <path d="M 10 20 L 18 28 L 30 12" stroke="currentColor" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
